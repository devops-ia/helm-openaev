{{ if .Values.testConnection }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openaev.fullname" . }}-test-connection"
  labels:
    {{- include "openaev.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      {{- if .Values.global.imageRegistry }}
      image: "{{ .Values.global.imageRegistry }}/busybox"
      {{- else }}
      image: busybox
      {{- end }}
      # the server can still be booting after an upgrade, so retry for up to 5 minutes
      command: ['sh', '-c']
      args:
        - for i in $(seq 60); do wget -q -O /dev/null {{ include "openaev.fullname" . }}-server:{{ .Values.service.port }} && exit 0; sleep 5; done; exit 1
  restartPolicy: Never
{{ end }}
