apiVersion: v2
name: openaev
description: A Helm chart to deploy the OpenAEV adversarial exposure validation platform
icon: https://raw.githubusercontent.com/OpenAEV-Platform/docs/f4ca064020d75f4cf6776ab6825c9cb0ae25f03e/docs/assets/images/favicon.png
type: application
kubeVersion: ">=1.23.0-0"
maintainers:
  - name: ialejandro
    email: hello@ialejandro.rocks
    url: https://ialejandro.rocks
sources:
  - https://github.com/devops-ia/helm-openaev
  - https://github.com/OpenAEV-Platform/openaev
version: 1.0.0
appVersion: 3.261110.0
home: https://www.filigran.io/en/solutions/products/openaev/
keywords:
  - openaev
  - cybersecurity
  - purple-team
  - attack-simulation
  - breach-simulator
  - threat
  - analysis
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.openaev.io
    - name: source
      url: https://github.com/devops-ia/helm-openaev
    - name: support
      url: https://github.com/devops-ia/helm-openaev/issues
dependencies:
  - name: rustfs
    version: 1.0.4
    repository: https://charts.rustfs.com
    condition: rustfs.enabled
  - name: opensearch
    version: 3.9.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch.enabled
  - name: postgresql
    version: 16.7.27
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: rabbitmq
    version: 16.0.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: rabbitmq.enabled
