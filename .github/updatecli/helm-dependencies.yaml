sources:
  caldera:
    kind: dockerimage
    spec:
      image: openbas/caldera-server
      architecture: linux/amd64
      versionFilter:
        kind: semver
        pattern: '*'
  rustfs:
    kind: helmchart
    spec:
      url: https://charts.rustfs.com
      name: rustfs
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: rustfs
  opensearch:
    kind: helmchart
    spec:
      url: https://opensearch-project.github.io/helm-charts/
      name: opensearch
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: opensearch
  # postgresql and rabbitmq have no target on purpose: their images are pinned
  # to bitnamilegacy, so the charts are bumped by hand. The sources stay because
  # the dependency workflows set a version pattern on every Chart.yaml dependency.
  postgresql:
    kind: helmchart
    spec:
      url: oci://registry-1.docker.io/bitnamicharts
      name: postgresql
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: postgresql
  rabbitmq:
    kind: helmchart
    spec:
      url: oci://registry-1.docker.io/bitnamicharts
      name: rabbitmq
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: rabbitmq
conditions: {}
targets:
  caldera:
    name: bump chart caldera tag
    kind: yaml
    spec:
      file: charts/openaev/values.yaml
      key: $.caldera.image.tag
    sourceid: caldera
  rustfs:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/openaev/Chart.yaml
      key: $.dependencies[0].version
    sourceid: rustfs
  opensearch:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/openaev/Chart.yaml
      key: $.dependencies[1].version
    sourceid: opensearch
